[base]
env_name = deep_hedging

[vec]
total_agents = 4096

[policy]
hidden_size = 64
num_layers = 2

# Defaults of ImpactConfig() in ../market.py; maturity is 30 / 365.
# w_init is in units of scale, w_eta the Robbins-Monro step for w.
[env]
s0 = 100.0
strike = 100.0
sigma = 0.2
mu = 0.0
maturity = 0.0821917808219178
cost = 0.002
fixed_cost = 0.02
kappa = 0.5
half_life = 1.0
alpha = 0.95
target_low = -0.5
target_high = 1.5
w_init = 0.3
w_eta = 0.01
shaping = 1
seed = 0

# One episode is one horizon segment of 32 env steps. gamma = 1: the
# objective is the undiscounted terminal loss.
[train]
horizon = 32
gamma = 1.0
gae_lambda = 0.95
minibatch_size = 8192
total_timesteps = 120_000_000
