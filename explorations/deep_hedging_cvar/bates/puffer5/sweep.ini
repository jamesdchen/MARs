# Search space for `./puffer sweep` (PufferLib 5.0's Protein tuner), appended
# to config/deep_hedging.ini by the Colab notebook. The notebook first removes
# the generic [sweep.*] sections from PufferLib's config/default.ini, so this
# file is the whole space. Not swept, on purpose:
#   train.horizon = 32      one episode in each segment (see SPEC.md)
#   vec.total_agents = 4096 keeps every minibatch_size below valid
#   train.gamma = 1         the objective is the undiscounted terminal loss
# The metric is the env's score = -(Rockafellar-Uryasev objective), averaged
# over the final 10000-episode eval of each run.

[sweep]
metric = score
goal = maximize
max_runs = 32
gpus = 1
downsample = 5
early_stop_quantile = 0.3
max_suggestion_cost = 1200

# Run length is Protein's cost axis.
[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 3e8
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.03
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
max = 0.995
scale = auto

# >= 0.5 so that the largest minibatch still gets one gradient step
# (updates = replay_ratio * 4096 * 32 / minibatch_size).
[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 4.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.6
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.env.w_eta]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.shaping]
distribution = int_uniform
min = 0
max = 1
scale = auto
