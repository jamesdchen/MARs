# docker compose -f deploy/docker-compose.yml up -d --build
services:
  polyrec:
    build: ..
    image: polyrec:latest
    restart: unless-stopped
    stop_grace_period: 90s          # SIGTERM -> flush parquet parts + close the raw log frame
    volumes:
      - /var/lib/polyrec:/data
      - ../config.example.toml:/app/config.toml:ro
    command: ["record", "--config", "/app/config.toml", "--out", "/data"]
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # fills winner / is_winning_outcome once markets resolve (every 15 min)
  backfill:
    image: polyrec:latest
    depends_on: [polyrec]
    restart: unless-stopped
    volumes:
      - /var/lib/polyrec:/data
    entrypoint: ["sh", "-c", "while true; do python /app/backfill_winners.py --out /data --recent 2; sleep 900; done"]
