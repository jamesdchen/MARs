# Generated by make_ini.py; appended to config/polymarket_mm.ini before
# `./puffer sweep`, after patch_pufferlib.py removed the generic [sweep.*]
# blocks of default.ini, so this is the whole space. Not swept: vec.total_agents
# (4096 keeps every horizon/minibatch pair valid) and the env knobs.
# metric = score is the env Log's mean P&L per episode, in $, of the final
# evaluation, which [eval_env] runs on the validation split; downsample = 1
# keeps the training curve (train split) out of Protein.

[sweep]
metric = score
goal = maximize
max_runs = 32
gpus = 1
downsample = 1
early_stop_quantile = 0.3
max_suggestion_cost = 1800

[sweep.train.total_timesteps]
distribution = log_normal
min = 20000000
max = 500000000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.98
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 65536
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 4
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto
