# Generated by make_ini.py; do not edit by hand.

[base]
env_name = "polymarket_mm"
eval_episodes = 4096
checkpoint_interval = 50

[vec]
total_agents = 4096

[policy]
hidden_size = 128
num_layers = 4

# Every knob of ../mm.h (see ../ENV.md). data_dir: absolute, or relative to
# the PufferLib root. Rewards are clamped to [-1, 1] by the trainer.
[env]
data_dir = "../MARs/explorations/deep_hedging_cvar/polymarket/data/build"
split = 0
allow_test = 0
fill_model = 1
latency = 1
dt = 1
Q = 10
inv_penalty = 0
reward_scale = 0.1
seed = 0

# [env] overrides for the trainer's final evaluation only (patch_pufferlib.py):
# every run, and every sweep trial, is scored on the validation split.
[eval_env]
split = 1

# 1 s steps, episodes of 301 to 14401 steps (one market each) with dense
# mark-to-market rewards: gamma 0.995 looks ~200 s ahead, past the 60 s
# markout. horizon is a multiple of 8, minibatch_size of horizon.
[train]
total_timesteps = 100000000
horizon = 128
minibatch_size = 16384
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.01
learning_rate = 0.015
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
max_grad_norm = 1.5
momentum = 0.95
