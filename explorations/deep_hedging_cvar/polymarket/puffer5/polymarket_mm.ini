# Generated by make_ini.py from ../mm.h and the data build; do not edit by hand.

[base]
env_name = polymarket_mm
# Final evaluation: each of the 247 validation markets played 16 times,
# one logged episode per env ([eval_env]).
eval_agents = 3952
eval_episodes = 3952
checkpoint_interval = 50

[vec]
total_agents = 4096

[policy]
hidden_size = 128
num_layers = 4

# The core's knobs and defaults (../mm.h, ../ENV.md), data_dir (absolute, or
# relative to the PufferLib root), seed (mixed with the env index) and the
# wrapper's log_episodes. The trainer clamps rewards to [-1, 1].
[env]
data_dir = "../MARs/explorations/deep_hedging_cvar/polymarket/data/build"
split = 0
allow_test = 0
fill_model = 1
latency = 1
match_delay = -1
dt = 0
dt_5m = 1
dt_15m = 1
dt_4h = 5
Q = 100
inv_penalty = 0.001
reward_scale = 0
size_mult = 1
part_cap = -1
fee_rate = -1
rebate_rate = -1
liq_rewards = 0
liq_moas = 1
mark_mode = 0
reward_mode = 0
tick_rule = 0
len_mask = 7
fixed_market = -1
fixed_start = -1
cycle_stride = 0
start_frac = 0.2
markout_h = 60
seed = 0
log_episodes = 0

# [env] overrides for the trainer's final evaluation only (patch_pufferlib.py):
# every train run and sweep trial is scored on the validation split.
[eval_env]
split = 1
fixed_start = 0
cycle_stride = 1
log_episodes = 1

# 1 s steps (5 s on 4h markets), episodes of up to 300 (5m), 900 (15m) and
# 2880 (4h) decisions, dense mark-to-market rewards: gamma 0.995 looks ~200
# steps ahead, past the 60 s markout. horizon is a multiple of 8,
# minibatch_size of horizon.
[train]
total_timesteps = 100000000
horizon = 128
minibatch_size = 16384
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.01
learning_rate = 0.015
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
max_grad_norm = 1.5
momentum = 0.95
